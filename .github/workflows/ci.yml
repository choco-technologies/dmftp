name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: chocotechnologies/dmod:1.0.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build dmftp and ftpd
        run: |
          mkdir -p build
          cd build
          cmake .. -DDMOD_MODE=DMOD_MODULE
          cmake --build .

      - name: Verify module files
        run: |
          echo "Checking for module files..."
          ls -lh build/dmf/
          test -f build/dmf/dmftp.dmf
          test -f build/dmf/dmftp_version.txt
          test -f build/dmf/ftpd.dmf
          test -f build/dmf/ftpd_version.txt
          test -f build/dmf/test_dmftp.dmf
          test -f build/dmf/test_ftpd.dmf
          echo "Module files present"

      # Both suites run, and each one's exit code is its number of failed
      # steps (see dmod_add_test), so a plain `set -e` is enough to fail the
      # job on any failing step.
      - name: Run tests with dmod_loader
        run: |
          set -e
          export DMOD_DMF_DIR=$(pwd)/build/dmf
          for suite in test_dmftp test_ftpd; do
            dmf-get install -d ${DMOD_DMF_DIR}/${suite}-local.dmd -y
            dmod_loader build/dmf/${suite}.dmf
          done
