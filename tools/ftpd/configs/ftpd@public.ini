# A real, runnable instance of the ftpd@.ini template: anonymous access to
# the whole device filesystem on the standard FTP port. Copy this file
# (naming the copy ftpd@<name>.ini) and edit `args=` to run another,
# independently configured instance alongside it - e.g. a private one on
# a different port, with a real username/password and a narrower --root:
#
#   args=--port 2121 --root /private --user admin --pass secret
#
# Both instances share the one ftpd binary but are otherwise completely
# independent processes - see ../docs/service.md.
args=--port 21 --root /
