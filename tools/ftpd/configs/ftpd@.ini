# ftpd@.ini - dmsystem unit TEMPLATE for the ftpd FTP server. Never
# started on its own ("ftpd@" with no instance name) - see ftpd@public.ini
# in this same directory for a real, runnable instance, and
# ../docs/service.md for how to add more (e.g. a second, authenticated
# instance on a different port serving a different directory).
description=FTP server
exec=ftpd
type=simple

# Every instance must set its own `args=` below - unlike getty@.ini's %i,
# there is no single per-instance value here (port/root/user/pass all
# vary together), so nothing meaningful can be inherited from this
# template alone. See ftpd@public.ini for the shape `args=` takes.
