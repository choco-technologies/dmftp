# A second, independent instance of the ftpd@.ini template, running
# alongside ftpd@public.ini: a different port, a real username/password
# instead of anonymous access, and a narrower root. Both instances share
# the one ftpd binary but are otherwise completely unrelated processes -
# see ../docs/service.md.
args=--port 2121 --root /dev --user admin --pass secret
