# ftpd.ini - dmsystem unit that loads and enables the dmftp module at
# boot, so this device starts serving FTP on `port` below with no manual
# step. Drop it into libsystemd's units directory - see dmsystem's
# configuration docs (https://github.com/choco-technologies/dmsystem/blob/main/app/libsystemd/docs/configuration.md#typelibrary-services-backed-by-a-library-module-not-a-process).
description=Serve files over FTP by loading the dmftp module
exec=dmftp
type=library

# type=library: dmftp is a Library-type DMOD module, not an Application - it
# has no main(), so it cannot be spawned as a process the way a "simple"/
# "oneshot" unit is. type=library tells libsystemd to load+enable "exec" as
# a module instead (the DMOD loader's own module lifecycle) when the unit
# is started, and to disable+unload it when the unit is stopped - see
# ../docs/service.md and dmsystem's configuration docs linked above.
#
# The keys below are dmftp's OWN settings, not dmsystem unit keys - dmftp's
# dmod_init() re-reads this exact same file for them (see
# src/dmftp_server.c's load_config()) once dmsystem has loaded+enabled it.
# dmsystem itself ignores unrecognized keys, so one file serves both
# readers - see docs/service.md for the full rationale.

# TCP port the control connection listens on.
port=21

# Virtual filesystem root every FTP path is resolved under - "/" is the
# device's real root (where dmramfs/dmffs are mounted by dmod-boot).
# Clients can never CWD/path their way above this, however many "../" they
# send.
root=/

# Username required to log in. The special value "anonymous"
# (case-insensitive) accepts ANY username/password - set a real username
# below before exposing this to an untrusted network.
user=anonymous

# Password required to log in when `user` above is not "anonymous". An
# empty value accepts any password for that username.
pass=
