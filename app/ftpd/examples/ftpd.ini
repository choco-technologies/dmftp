# ftpd.ini - the FTP service configuration, read from /etc/ftpd.ini by
# default (override with `--config PATH`).
#
# Every value here can also be given as a command-line flag, and the flag
# wins - so several units can share one file and still differ in a setting
# or two. See docs/configuration.md for the full reference.

[server]
# Control port to listen on.
port = 21

# The directory every session is confined to. A client can never resolve a
# path outside it: a `..` that would climb past it is clamped, exactly as a
# chrooted FTP server behaves.
root = /srv/ftp

# Refuse every mutating command (STOR, DELE, MKD, RMD, RNFR/RNTO, APPE).
readonly = false

# Text of the 220 greeting the server sends on connect.
banner = dmftp ready

# Concurrent session limit; 0 means unlimited. Each session costs a control
# connection plus, during a transfer, a data connection - keep this in
# proportion to the device's RAM.
max_sessions = 4

# Which data-connection modes to answer. Disabling both would leave a server
# no client could transfer anything through, so that combination is treated
# as "no preference" and enables both.
passive = true
active = true

# Local port for an active-mode (PORT) data connection; 0 picks an ephemeral
# one. Set to 20 for RFC 959's classic behaviour, which some firewalls still
# expect to see.
active_data_port = 0

# Accept the names `anonymous` and `ftp` with any password, always read-only.
# Off by default: an FTP server that anyone can read is a deliberate choice,
# not a default.
anonymous = false

# ---------------------------------------------------------------------------
# Accounts: one `name = password` per line. An empty password accepts any
# password for that name (useful for a guest account behind a trusted
# network, but see the security note in docs/configuration.md).
# ---------------------------------------------------------------------------
[users]
admin = s3cret
guest =

# ---------------------------------------------------------------------------
# Optional per-user home directory, resolved inside `root` above. A user with
# no entry here gets `root` itself.
# ---------------------------------------------------------------------------
[home]
guest = /pub

# ---------------------------------------------------------------------------
# Optional per-user write permission. Missing means "whatever [server]
# readonly says". A user can only ever be restricted further, never granted
# more than the server allows.
# ---------------------------------------------------------------------------
[readonly]
guest = true
