# ftpd unit file for dmsystem's `systemd` - copy to the units directory it
# scans (e.g. /etc/dmsystem/units/ftpd.ini) and adjust.
#
# `after`/`requires` name the networking unit because ftpd binds a TCP port
# the moment it starts: without an interface up, dmftp_server_start() has
# nothing to listen on.
description=FTP server
exec=ftpd
args=--config /etc/ftpd.ini
after=networking
requires=networking
type=simple
restart=always
stdout=/var/log/ftpd.log
stderr=/var/log/ftpd.log
